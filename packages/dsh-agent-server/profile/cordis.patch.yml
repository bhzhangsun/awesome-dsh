# dsh-profile-server / cordis.patch.yml
#
# Turns the web profile into a PURE API server: the browser GUI is disabled,
# while the HTTP/WS transport and the Typert Remote controllers stay.
#
# WHY this works:
#   - The `/api` transport is carried by `connection` (@deepseek-ai/dsh-client-connection),
#     whose NODE half binds the gateway to the webserver under `/api` and whose
#     browser half is only the fetch/SSE client. We keep the node half, so the API
#     surface survives with no browser present.
#   - `dsh-client-ui-*`, `modules` (client-modules), `client-hmr`, and
#     `cordis-client-runner` are purely browser-surface rows. Disabling them drops
#     the GUI and the `/plugins/<id>/client.js` bundle routing without touching
#     the gateway, controllers, or session wiring.
#   - `web-runtime` (@deepseek-ai/dsh-web-app) is kept because `connection`
#     injects `webRuntime` (trustedHosts / bind). We only turn off the auto-open
#     browser; it still prints the URL line.
#
# The `server` AGENT preset supplies the tool set. The base web-app layer moved
# the agent-plane rows behind presets, so choosing the `server` preset in a
# session (or as the roster default, below) gives the pure-reasoning agent.
#
# HOW TO USE:
#   Standalone — this profile already applies the patch, so no --patch is needed:
#     dsh --profile server
#
#   Or overlay it onto an existing `web` boot instead of using this profile:
#     dsh --profile web --patch ./cordis.patch.yml
#
#   Then call the API externally over:
#     ws://<host>:<port>/api/remote.mux   (Typert Remote RPC)
#     http://<host>:<port>/api/...        (HTTP RPC bridge)

# ── keep the server transport, close the browser surface ────────────────────

- id: web-runtime
  config:
    openBrowser: false
    printUrl: true
    surfaceContext: true

# Browser GUI rows — disable each by id. A row absent from a later layer would
# silently reappear, so we disable rather than delete.

- id: client-hmr
  disabled: true

- id: modules
