# CI for packages/dsh-computer-use.
#
# Moved here from the package's own `.github/` directory: GitHub only runs
# workflows from the repository root, so a workflow inside a package directory
# never executed after the plugin was imported into this monorepo.
#
# The package is plain ESM JavaScript with no build step, so this job needs no
# install step — just syntax gates plus the cursor-theme generator check.

name: computer-use CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: packages/dsh-computer-use

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # The plugin declares engines.node >= 22.18.0, and this monorepo
          # requires ^22.19.0 || >=24.0.0 (the upstream workflow used 20).
          node-version: 22

      - name: JS syntax check (node --check)
        run: |
          for f in index.js lib/*.js; do node --check "$f"; done

      - name: Shell syntax check (bash -n)
        run: |
          bash -n install.sh
          bash -n uninstall.sh

      - name: Theme generator sanity (make_theme.py)
        run: |
          python3 tools/make_theme.py --output /tmp/theme.lottie
          python3 -c "import zipfile,json; z=zipfile.ZipFile('/tmp/theme.lottie'); assert json.loads(z.read('cua/theme.json'))['id']=='com.dsh.computeruse.rainbow'; print('theme OK')"
