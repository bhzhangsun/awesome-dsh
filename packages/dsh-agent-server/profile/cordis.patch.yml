# ── default the roster to the `server` preset ───────────────────────────────
# The `server` preset is discovered automatically from $DSH_HOME/.agent-presets/
# (includeUserRoot: true). Making it the default means every session created on
# this profile boots the pure-reasoning agent without an explicit pick or flag.

- id: agent-presets
  config:
    default: server
